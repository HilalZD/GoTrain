[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gotrain"
version = "0.1.0"
description = "An AI agent that trains geospatial models on GEO-Bench by itself."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents==1.63.0",  # verified on SageMaker; newer versions untested
    "geobench",
    "pydantic>=2",
    "pydantic-settings>=2",
    "boto3",
    "mcp",
    "rich",
    "pyyaml",
    "rasterio",  # the models MCP server reads and writes GeoTIFFs
    # unpinned so an install never replaces the instance's versions (numpy 2.5.4)
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Deliberately unpinned and optional: the SageMaker instance already ships a CUDA
# build of torch. A plain `pip install -e .` must never touch it. See README.
ml = [
    "torch",
    "torchvision",
    "timm",
    "torchgeo",
    "segmentation-models-pytorch",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gotrain = "gotrain.cli:main"

[tool.setuptools.packages.find]
include = ["gotrain*"]

[tool.setuptools.package-data]
gotrain = ["prompts/*.md", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
